name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      # bun.lock is the only lockfile in the repo, so npm ci/npm install resolve a
      # different tree than the one this project was built against.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          code=$?
          cat /tmp/test.log
          if [ "$code" -ne 0 ]; then
            { grep -E '^# (tests|pass|fail)' /tmp/test.log; awk '/✖|not ok|AssertionError/{f=18} f>0{print; f--}' /tmp/test.log | tail -n 16; } | cut -c1-180 | tr -d '%|' | sed 's/^/::error::test: /'
          fi
          exit "$code"
